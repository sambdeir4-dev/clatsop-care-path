<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clatsop Care Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Fixed header and tab bar, scrolling middle, one question per screen. */
:root{
  --bg:#EAF0EF;            /* coastal fog */
  --surface:#FFFFFF;
  --ink:#0F2A2C;           /* wet basalt */
  --muted:#4D6567;
  --line:#CFDAD9;
  --brand:#0E5450;         /* spruce */
  --brand-ink:#FFFFFF;
  --brand-soft:#DCEBE8;
  --guide:#FFF3CC;         /* lighthouse lamp */
  --guide-line:#D9A91F;
  --guide-ink:#4E3B00;
  --crisis:#B4261C;
  --crisis-ink:#FFFFFF;
  --crisis-soft:#FBE7E4;
  --outer:#D9E3E2;
  --font-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1617;--surface:#132324;--ink:#E7F0EF;--muted:#9BB1B1;--line:#283B3C;
    --brand:#74D3C6;--brand-ink:#052220;--brand-soft:#1A3533;
    --guide:#2C260E;--guide-line:#C99E2B;--guide-ink:#F3DE9E;
    --crisis:#FF8F83;--crisis-ink:#2A0906;--crisis-soft:#391916;--outer:#060D0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1617;--surface:#132324;--ink:#E7F0EF;--muted:#9BB1B1;--line:#283B3C;
  --brand:#74D3C6;--brand-ink:#052220;--brand-soft:#1A3533;
  --guide:#2C260E;--guide-line:#C99E2B;--guide-ink:#F3DE9E;
  --crisis:#FF8F83;--crisis-ink:#2A0906;--crisis-soft:#391916;--outer:#060D0E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--guide-line);outline-offset:2px;border-radius:6px}
svg{flex:none}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand b{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted);display:block}
.brand{min-width:0}
.sos{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--crisis);color:var(--crisis);background:var(--crisis-soft);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px}
main:focus{outline:none}
main>*{flex-shrink:0}
main>:last-child:not(.actions){margin-bottom:24px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.12;font-weight:700}
h2{font-size:23px;line-height:1.15;font-weight:700}
h3{font-size:17px;line-height:1.25;font-weight:600}
p{margin:0}
.lede{color:var(--muted);font-size:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:16px}

.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress i{height:5px;border-radius:99px;background:var(--line)}
.progress i.on{background:var(--brand)}

.guide{background:var(--guide);color:var(--guide-ink);border-left:4px solid var(--guide-line);border-radius:10px;padding:12px 14px}
.guide .gl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}

.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:56px}
.opt .box{width:22px;height:22px;margin-top:1px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:transparent}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-pressed="true"] .box,.opt[aria-checked="true"] .box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt.alert{border-color:var(--crisis)}
.opt.alert[aria-pressed="true"],.opt.alert[aria-checked="true"]{background:var(--crisis-soft);border-color:var(--crisis)}
.opt.alert[aria-pressed="true"] .box,.opt.alert[aria-checked="true"] .box{background:var(--crisis);border-color:var(--crisis);color:var(--crisis-ink)}

.actions{display:flex;gap:10px;position:sticky;bottom:0;margin:4px -16px 0;padding:14px 16px 14px;background:linear-gradient(to top,var(--bg) 82%,transparent)}
.btn{flex:1;border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--brand);color:var(--brand-ink);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--crisis);color:var(--crisis-ink)}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.first{border:2px solid var(--brand)}
.card.red{border:2px solid var(--crisis);background:var(--crisis-soft)}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--brand);color:var(--brand-ink)}
.tag.soft{background:var(--brand-soft);color:var(--brand)}
.card p{font-size:15px}
.why{color:var(--muted);font-size:14px}
.ask{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.ask b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:2px}
.meta{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--muted)}
.meta div{display:flex;gap:8px;align-items:flex-start}
.meta svg{margin-top:2px}
.call{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--brand);border-radius:10px;padding:11px 12px;text-decoration:none;color:var(--ink);font-weight:600;background:var(--surface)}
.call span{display:inline-flex;align-items:center;gap:8px;color:var(--brand)}
.call em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.card.red .call{border-color:var(--crisis)}
.card.red .call span{color:var(--crisis)}
.note{font-size:13.5px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.bands{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.bands div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;padding:11px 12px;font-size:14.5px;border-top:1px solid var(--line)}
.bands div:first-child{border-top:0}
.bands span{font-variant-numeric:tabular-nums;font-weight:700}
.bands small{display:block;color:var(--muted);font-size:13px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.script{background:var(--surface);border:1px dashed var(--muted);border-radius:12px;padding:14px;font-size:15px}
.check{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fine{font-size:13px;color:var(--muted)}
.src{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.plans{display:flex;flex-wrap:wrap;gap:8px}
.plans button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px}
.plans button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.acc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.acc>div{display:flex;flex-direction:column;gap:6px;padding:13px 14px;border-top:1px solid var(--line)}
.acc>div:first-child{border-top:0}
.acc .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc b{font-weight:600}
.acc p{font-size:14px;color:var(--muted)}
.acc a.tel{font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none}
.st{font-style:normal;flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.st.yes{background:var(--brand);color:var(--brand-ink)}
.st.most{background:var(--brand-soft);color:var(--brand)}
.st.slide{background:var(--guide);color:var(--guide-ink);border:1px solid var(--guide-line)}
.st.ask{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st.no{background:var(--crisis-soft);color:var(--crisis)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tools{display:flex;gap:6px;align-items:center}
.tool{display:inline-grid;place-items:center;min-width:40px;height:38px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.top{flex-wrap:nowrap;padding:10px 12px}
.tools{flex:none}
@media (max-width:440px){.mark{display:none}.brand small{display:none}.tool{min-width:36px;padding:0 6px}.sos{padding:8px 10px}}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:96px}
.qbtn .qi{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.qbtn b{font-weight:700;font-size:15px;line-height:1.25}
.qbtn small{color:var(--muted);font-size:13px;line-height:1.3}
.share{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.share p{font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button.t-crisis[aria-current="page"]{color:var(--crisis)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.seg button{transition:background-color .15s,border-color .15s}}
</style>
</head>

<div class="app">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Clatsop Care Path, go to start">
      <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-5 4-5 4-9a3 3 0 0 1 6 0c0 4 4 4 4 9"/><circle cx="12" cy="5" r="1.6"/></svg></span>

    </div>

  <main id="main" tabindex="-1"></main>

    <button data-act="tab" data-v="insurance"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>Insurance</button>
    <button class="t-crisis" data-act="tab" data-v="crisis"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Crisis</button>
  </nav>
</div>

function buildPlan(){
 var adult=S.who!=="minor",senior=S.who==="senior",sud=!!S.concerns.sud,psy=!!S.concerns.psy;
 var urgent=S.urgency!=="wait"||psy;
 var cbh=adult?K.cbh:K.cbhKids,list=[];
 var c=S.cov;
 if(c==="ohp")list=[[cbh,"OHP covers care here at no cost to you."],[K.cmh,"A good choice if you already have a doctor at one of these clinics."],[K.coastal],[K.cco,"Call if you cannot get an appointment or want other options."]];
 else if(c==="private")list=[[K.insurer,"Your plan decides which providers are covered, so start here to avoid a surprise bill."],[K.eap,"Often the fastest way to talk with a counselor at no cost."],[K.cmh],[cbh,null,"Ask whether they bill your plan."]];
 else if(c==="medicare")list=[[K.cmh,"Primary care clinics are the quickest way into mental health care with Medicare."],[cbh,null,"Ask whether they bill your Medicare plan."],[K.coastal],[K.shiba]];
 else if(c==="va")list=adult?[[K.va,"Your VA benefits cover mental health care here."],[K.cvso],[cbh,"A local option if you prefer care outside the VA.",null]]:[[K.tricare,"TRICARE decides which providers are covered for a child or teen."],[cbh],[K.cmh]];
 else if(c==="none")list=[[cbh,"You can start here without insurance.","Ask about paying without insurance and whether a sliding fee applies."],[K.coastal,"Fees are based on your income."],[K.ohp,"Apply now so future visits are covered."],[K.eap]];
 else list=[[cbh,"You can start here while you sort out coverage.","Ask the Engagement Specialist to help check your coverage."],[K.coastal,"Fees are based on your income if it turns out you are uninsured."],[K.ohp,"ONE Customer Service can tell you whether you already have active OHP."],[K.eap]];
 if(!adult)list=list.filter(function(x){return x[0]!==K.eap;});
 var first,why;
 if(urgent){
  first=adult?K.rac:K.cbhYouthUrgent;
  why=psy?"These symptoms should be seen soon. This is the fastest in-person option in the county.":"You said you need help now. This is the fastest in-person option in the county.";
  if(psy)why+=" If the person is 12 to 25, ask about EASA, the early psychosis program.";
 }else{first=list[0][0];why=list[0][1];var fn=list[0][2];list=list.slice(1);if(fn)first=Object.assign({},first,{note:fn});}
 if(sud&&adult)list.unshift([K.sud,"You asked for help with alcohol or drug use."]);
 if(sud&&!adult)why=(why||"")+" Tell them alcohol or drug use is part of the concern.";
 if(!adult)list.push([K.warm]);
 if(senior){list.push([K.nwsds,"Local help for people 60 and older, including Medicare counseling."]);list.push([K.lonely]);}
 if(senior&&c!=="medicare")list.push([K.shiba,"Most people 65 and older qualify for Medicare. Free help to sign up."]);
 list.push(c==="ohp"?[K.nwrides,"Need a ride? It is free with your OHP."]:[K.bus,"Need a ride to your appointment?"]);
 return {first:first,why:why,rest:list,urgent:urgent};
}

 if(S.crisisFrom)h+='<article class="card"><p>Your answer tells us safety comes first. Please reach out to one of these now. When you are ready, you can finish the guide to set up ongoing care.</p></article>';
 h+=card(K.c988)+card(K.ccl)+card(K.c911)+card(K.er)+card(K.vcl);
 h+=guide(["Stay with someone you trust, or ask them to come to you.","Move away from anything you could use to hurt yourself.","If you cannot call, text 988."]);
 if(S.crisisFrom)h+='<div class="actions"><button class="btn" data-act="resume">I am safe for now. Continue the guide</button></div>';
 return h;
}

/* ---------- Accessibility: text size and read aloud ---------- */
var Z=1;
function stopSpeak(){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}var b=document.getElementById("speak");if(b)b.setAttribute("aria-pressed","false");}
function speak(btn){
 try{
  var ss=window.speechSynthesis;if(!ss){btn.setAttribute("aria-label","Read aloud is not available on this device");return;}
  if(ss.speaking){stopSpeak();return;}
  var txt=main.innerText.replace(/\s+/g," ").slice(0,4000);
  var u=new SpeechSynthesisUtterance(txt);u.rate=0.95;u.lang=S.view==="topic"&&S.topic==="es"&&S.tab==="guide"?"es-US":"en-US";
  u.onend=stopSpeak;btn.setAttribute("aria-pressed","true");ss.speak(u);
 }catch(e){stopSpeak();}
}

/* ---------- Render ---------- */
function render(keep){
 if(!keep)stopSpeak();
 var v=S.tab==="crisis"?vCrisis():S.tab==="directory"?vDirectory():S.tab==="insurance"?vInsurance():{topic:vTopic,home:vHome,s1:vS1,s2:vS2,s3:vS3,s3b:vS3b,plan:vPlan}[S.view]();
 var y=main.scrollTop;
 main.innerHTML=v;
 main.scrollTop=keep?y:0;
 var t=document.querySelectorAll(".tabs button");
 for(var i=0;i<t.length;i++){if(t[i].getAttribute("data-v")===S.tab)t[i].setAttribute("aria-current","page");else t[i].removeAttribute("aria-current");}
 if(!keep){try{main.focus({preventScroll:true});}catch(e){}}
}
function setTab(t,fromHash){
 S.tab=t;
 if(!fromHash){try{if(location.hash!=="#"+t)location.hash=t;}catch(e){}}
 render();
}
function toCrisis(from){S.crisisFrom=from;S.shown=true;setTab("crisis");}

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act]");if(!el)return;
 var a=el.getAttribute("data-act"),v=el.getAttribute("data-v");
 if(a==="tab"){if(v!=="crisis")S.crisisFrom=S.tab==="crisis"?null:S.crisisFrom;setTab(v);}
 else if(a==="home"){S.view="home";S.crisisFrom=null;setTab("guide");}
 else if(a==="go"){S.view=v;render();}
 else if(a==="concern"){S.concerns[v]=!S.concerns[v];render(true);}
 else if(a==="urg"){S.urgency=v;render(true);}
 else if(a==="who"){S.who=v;render(true);}
 else if(a==="cov"){S.cov=v;render(true);}
 else if(a==="hh"){S.hh=+v;render(true);}
 else if(a==="ins"){S.ins=v;render(true);}
 else if(a==="topic"){S.topic=v;S.view="topic";setTab("guide");}
 else if(a==="tsize"){Z=Z>=1.3?1:Math.round((Z+0.15)*100)/100;main.style.zoom=Z;el.setAttribute("aria-pressed",Z>1?"true":"false");}
 else if(a==="speak"){speak(el);}
 else if(a==="share"){var u=location.href.split("#")[0];try{navigator.clipboard.writeText(u).then(function(){el.textContent="Copied";},function(){el.textContent=u;});}catch(err){el.textContent=u;}}
 else if(a==="tab2"){S.view=v;setTab("guide");}
 else if(a==="next1"){if(S.concerns.safety&&!S.shown)toCrisis("s1");else{S.view="s2";render();}}
 else if(a==="next2"){if(S.urgency==="now"&&!S.shown)toCrisis("s2");else{S.view="s3";render();}}
 else if(a==="next3"){S.view=S.cov==="none"?"s3b":"plan";render();}
 else if(a==="resume"){S.view=S.crisisFrom==="s1"?"s2":"s3";S.crisisFrom=null;setTab("guide");}
 else if(a==="restart"){S.view="home";S.concerns={};S.urgency=S.who=S.cov=null;S.hh=1;S.crisisFrom=null;S.shown=false;render();}
 else if(a==="copy"){
  var txt=document.getElementById("script").textContent;
  var done=function(ok){el.textContent=ok?"Copied":"Press and hold the text to copy";};
  try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
 }
});
function fromHash(){
 var h=(location.hash||"").replace("#","");
 if(h==="guide"||h==="directory"||h==="crisis"||h==="insurance"){if(h!==S.tab)setTab(h,true);}
}
window.addEventListener("hashchange",fromHash);
var h0=(location.hash||"").replace("#","");
if(h0==="directory"||h0==="crisis"||h0==="insurance")S.tab=h0;
render();
})();
</script>
